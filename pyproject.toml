[project]
name = "cnn-lstm-natural-images"
version = "1.0.0"
description = "CNN-LSTM image classification on the Kaggle Natural Images dataset"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "pillow>=10.0",
    "matplotlib>=3.9",
    "kagglehub>=0.3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["pandas>=2.0", "nbformat>=5.0", "nbclient>=0.10", "nbconvert>=7.0", "ipykernel>=6.0"]
report = ["python-docx>=1.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
